name: Release

on:
  push:
    branches: [main]

# This package is not published to npm -- the deliverable is a downloadable
# bundle (dist/jarchi/archi-xma-script.bundle.cjs) plus the loader script
# (jarchi/convert-to-xma.ajs), attached to each GitHub Release. Only
# contents:write is needed (creating the git tag and the GitHub Release,
# both outside the protected refs/heads/main namespace -- no ruleset bypass
# required). No id-token:write: no OIDC, no npm Trusted Publishing.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # dist/jarchi/archi-xma-script.bundle.cjs is what gets attached to the
      # release (see .releaserc.json's @semantic-release/github assets) --
      # build it explicitly before semantic-release runs.
      - run: npm run bundle
      # No @semantic-release/npm, no @semantic-release/git, no chore(release)
      # commit, no push to refs/heads/main. semantic-release computes the
      # next version, creates the git tag (refs/tags/vX.Y.Z), and creates
      # the GitHub Release with the two build artifacts attached.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
